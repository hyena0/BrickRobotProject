# 가상 카메라 (6단계 추가 문서 3절). 실물 캘리브레이션 생략용 고정 자세.
# B2를 할 때 실물 카메라 자세(config/camera.local.yaml)로 교체한다.
#
# 좌표계: 받침대 기준 = 로봇 베이스 기준(mm). x 우, y 앞, z 위.
# 원점 z=0은 받침대 윗면 (assets/private/mat_points.json과 동일 프레임).
# 휴대폰을 삼각대 암으로 받침대 위 55cm에 고정하고 매트를 향해
# 아래로 기울여 내려다보는 자세이다 (수직에서 약 28도). 영상 위쪽은
# 먼쪽(+y), 오른쪽은 +x.
#
# 프레이밍 근거: 6.0 게이트(첫 프레임에 블록은 보이고 팔은 안 보임).
# 수직 내려다보기에서는 베이스(x>=-13)가 프레임을 벗어날 수 없어서,
# 카메라를 매트 남쪽(y=-60)에 두고 북쪽을 보게 했다. 베이스와 대기
# 자세는 프레임 아래·오른쪽 밖, 블록 모서리는 전부 안에 들어온다.
frame: "robot_base_mm, z0 = pedestal top"
position_mm: [-133.0, -60.0, 550.0]
look_at_mm: [-133.0, 235.0, 0.0]
height_note: "pedestal top +550mm (50~60cm 범위 안)"
image_px: [256, 256]
fov_deg: 22.0
up_hint: "+y is image-up"
